name: Model compatibility
on:
  pull_request:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        model: [rf, minirocket]
    steps:
      - uses: actions/checkout@v4
      - name: Build model-specific runtime from shared source
        run: docker build --target ${{ matrix.model }} -t skydetect-runtime .
      - name: Build test-only layer
        run: docker build -f docker/Dockerfile.test --build-arg RUNTIME_IMAGE=skydetect-runtime -t skydetect-check .
      - name: Compare frozen model outputs and shared contracts
        run: docker run --rm --network none skydetect-check
      - name: Hardware unit regression (no camera access)
        if: matrix.model == 'rf'
        run: docker run --rm --network none -v "$PWD/hardware:/hardware:ro" skydetect-check python -m unittest discover -s /hardware/raspberry-pi -p 'test_*.py' -q
  clip-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone clip image
        run: docker build -t skydetect-clip-check hardware/raspberry-pi/bridge
      - name: Non-root FFmpeg extraction and PTS mapping
        run: docker run --rm --network none --user 1000:1000 -v "$PWD/tests/clip_image_smoke.py:/tmp/smoke.py:ro" skydetect-clip-check python /tmp/smoke.py
